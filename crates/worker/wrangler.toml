name = "catalog-search"
main = "build/worker/shim.mjs"
compatibility_date = "2025-11-01"

# Run from this directory (the Workers Builds root directory, and where the npm scripts run),
# so the relative paths in `npm run build` mean the same thing everywhere. Workers Builds
# may not read this section; its Build command is set to the same `npm run build`.
[build]
command = "npm run build"

[[d1_databases]]
binding = "DB"
database_name = "catalog-search"
database_id = "7c970f16-e88d-4852-8a62-d91dd13416c7"
migrations_dir = "../core/migrations"
