name: load index

# Rebuilds the D1 index from the catalog's latest release. Workers Builds only runs on a push
# and its token can't write to D1, so refreshing the data is this workflow's job. The catalog
# is rebuilt daily, hence the schedule.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency: load-index

jobs:
  load:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set, so nothing was loaded. See the README."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.creds.outputs.ready == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.creds.outputs.ready == 'true'
        uses: Swatinem/rust-cache@v2
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.creds.outputs.ready == 'true'
        run: npm ci --prefix crates/worker

      - if: steps.creds.outputs.ready == 'true'
        run: curl -fsSL -o catalog.jsonl https://github.com/source-cooperative/metadata-catalog/releases/latest/download/catalog.jsonl
      - if: steps.creds.outputs.ready == 'true'
        run: npm run index
      - if: steps.creds.outputs.ready == 'true'
        run: npm run db:migrate:remote --prefix crates/worker
      - if: steps.creds.outputs.ready == 'true'
        run: npm run db:load:remote --prefix crates/worker
